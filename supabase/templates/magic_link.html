<h2>Prijava u Dinar po dinar</h2>
<p>Da biste se prijavili, otvorite link ispod u pregledaču u kom koristite Dinar po dinar:</p>
<p><a href="{{ .ConfirmationURL }}">Prijavi me</a></p>

<p>Link važi jednom. Ako ga niste tražili, možete zanemariti ovu poruku.</p>
